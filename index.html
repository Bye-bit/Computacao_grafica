<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transformações Geométricas 2D</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Transformações Geométricas 2D</h1>
      </header>

      <section class="game">
        <canvas id="canvas" width="1000" height="600"></canvas>
      </section>

      <section class="controls">
        <div class="control">
          <strong>A</strong>
          <span>Movimentar para esquerda</span>
        </div>

        <div class="control">
          <strong>D</strong>
          <span>Movimentar para direita</span>
        </div>
        <div class="control">
          <strong>W</strong>
          <span>Diminuir o tamanho do carro</span>
        </div>
        <div class="control">
          <strong>S</strong>
          <span>Aumentar o tamanho do carro</span>
        </div>
      </section>
      <footer>
        <p>Transformações 2D • Canvas + JavaScript</p>
        <p>Feito Por Lucas Fernandes e Anna Beatriz</p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
